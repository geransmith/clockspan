services:
  clockspan:
    image: ghcr.io/geransmith/clockspan:latest
    container_name: clockspan
    restart: unless-stopped
    ports:
      # host:container. Change the left side to serve on another host port.
      - '8080:8080'
    volumes:
      # The SQLite database. DATA_PATH comes from .env (default ./data next to this file);
      # the container takes ownership of it as PUID:PGID.
      - ${DATA_PATH:-./data}:/data
    # Configuration lives in .env next to this file; copy .env.example to start. Without a
    # .env the image defaults apply: no sign-in, port 8080. `required` needs Compose 2.24+.
    env_file:
      - path: .env
        required: false
