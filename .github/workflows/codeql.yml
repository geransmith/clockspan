name: CodeQL

# Static security analysis of the TypeScript (server, client, shared, scripts). Findings go to
# the repository's code scanning alerts, and on a pull request GitHub adds a "CodeQL" check
# that fails when the PR brings in a new alert at the severity the repository's code scanning
# settings name (high or higher by default). The weekly run picks up new queries against code
# nobody touched. Nothing is built: CodeQL reads JavaScript and TypeScript from source.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays, off the hour

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # security-extended adds the lower-precision security queries to the default set; the
      # code-quality queries stay out, oxlint covers that ground. js/missing-rate-limiting is
      # dropped: it flags every route that touches the database and doesn't see the login
      # limiter in server/auth/local.ts, so each new route would fail the PR check. Rate limits
      # beyond sign-in are the reverse proxy's job for a self-hosted app.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - coverage
            query-filters:
              - exclude:
                  id: js/missing-rate-limiting
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
