name: Workflow lint

# zizmor audits the workflows and dependabot.yml for security problems: template injection,
# over-broad tokens, unpinned or impostor actions, risky triggers, missing cooldowns. It runs
# only when something under .github/ changes, so other PRs pay nothing, and for the same
# reason it is not a required check: a PR it never ran on must still be able to merge.
on:
  pull_request:
    paths: ['.github/**']
  push:
    branches: [main]
    paths: ['.github/**']

permissions: {}

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Findings print in the log and fail the job; nothing is uploaded to code scanning, so
      # no further permission. zizmor itself is the action's default (latest), so new audits
      # apply as they ship; the action is pinned and Dependabot bumps it with the others.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          inputs: .github/
