name: CI

on:
  pull_request:
  push:
    branches: [main] # check + `edge` image; a version bump also publishes the release

# Read-only by default: `check` runs on every PR and needs nothing more. The jobs that
# publish ask for exactly what they write.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # HEAD~1, for the version comparison below
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      # A commit that changes package.json's version is a release: the merge of the bump PR
      # publishes the versioned image and the GitHub Release (no tag is pushed by hand). On a
      # PR the same comparison, against the base branch, refuses a version that already has a
      # tag before anything is built.
      - name: Detect a version bump
        id: version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --depth=1 origin "$base"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          git show "$base:package.json" > /tmp/prev-package.json
          prev="$(node -p "require('/tmp/prev-package.json').version")"
          changed=false
          [ "$pkg" != "$prev" ] && changed=true
          if [ "$changed" = true ] && git ls-remote --exit-code --tags origin "refs/tags/v$pkg" >/dev/null; then
            echo "v$pkg is already released; a version is never reused (CONTRIBUTING.md)"
            exit 1
          fi
          release=false
          [ "$changed" = true ] && [ "$GITHUB_EVENT_NAME" = push ] && release=true
          echo "version $prev -> $pkg (changed: $changed, release: $release)"
          {
            echo "release=$release"
            echo "version=$pkg"
            echo "minor=${pkg%.*}"
          } >> "$GITHUB_OUTPUT"

  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Every push to main is `edge`; a version bump is also X.Y.Z, X.Y and latest.
          tags: |
            type=edge,branch=main
            type=raw,value=${{ needs.check.outputs.version }},enable=${{ needs.check.outputs.release == 'true' }}
            type=raw,value=${{ needs.check.outputs.minor }},enable=${{ needs.check.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.check.outputs.release == 'true' }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations show up as an "unknown/unknown" platform on the GHCR page; skip them.
          provenance: false

  release:
    if: github.event_name == 'push' && needs.check.outputs.release == 'true'
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Write release body
        run: |
          printf '## Docker\n\n```\ndocker pull %s:%s\n```\n\n' "$IMAGE" "$VERSION" > body.md
      # The tag does not exist yet: gh creates it at --target, the squash commit that bumped the
      # version. A tag made with GITHUB_TOKEN starts no workflow, so nothing runs twice.
      - run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file body.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
