name: CI

on:
  pull_request:
  push:
    branches: [main]      # check + `edge` image
    tags: ['v*']          # check + versioned image + GitHub Release

# Read-only by default: `check` runs on every PR and needs nothing more. The jobs that
# publish ask for exactly what they write.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          [ "v$pkg" = "$GITHUB_REF_NAME" ] || { echo "package.json is $pkg but the tag is $GITHUB_REF_NAME; bump the version in a PR first (CONTRIBUTING.md)"; exit 1; }

  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` is added automatically on semver tags (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations show up as an "unknown/unknown" platform on the GHCR page; skip them.
          provenance: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
    steps:
      - name: Write release body
        run: |
          printf '## Docker\n\n```\ndocker pull %s:%s\n```\n\n' "$IMAGE" "${GITHUB_REF_NAME#v}" > body.md
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file body.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
