name: CI

on:
  pull_request:
  push:
    branches: [main] # check + `edge` image; a version bump also publishes the release

# Read-only by default: `check` runs on every PR and needs nothing more. The jobs that
# publish ask for exactly what they write. Every action is pinned to a commit SHA (a tag can be
# moved to other code, a SHA can't); Dependabot bumps the SHA and its version comment together.
permissions:
  contents: read

# A newer push to a pull request replaces the run already going. A push to main gets a group of
# its own (the commit), so no run there is ever cancelled or kept waiting: GitHub keeps only one
# pending run per group and drops the rest, and a dropped run on main could be a release.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      major: ${{ steps.version.outputs.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # HEAD~1, for the version comparison below
          # Nothing here pushes with git, so the token isn't left in .git/config for later
          # steps. The repository is public: the ls-remote below needs no token.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # A commit that changes package.json's version is a release: the merge of the bump PR
      # publishes the versioned image and the GitHub Release (no tag is pushed by hand). On a
      # PR the same comparison, against the base branch (the first parent of GitHub's merge
      # commit), refuses what CONTRIBUTING.md rules out: a version that isn't plain X.Y.Z (no
      # pre-releases), one lower than before, or one that already has a tag. It needs only git
      # and node, so it runs first: a bad version fails in seconds, not after the install, the
      # tests and the build.
      - name: Detect a version bump
        id: version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          prev="$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          changed=false
          [ "$pkg" != "$prev" ] && changed=true
          if ! printf '%s' "$pkg" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "version $pkg is not X.Y.Z; pre-releases are not used (CONTRIBUTING.md)"
            exit 1
          fi
          if [ "$changed" = true ] && [ "$(printf '%s\n%s\n' "$prev" "$pkg" | sort -V | tail -n 1)" != "$pkg" ]; then
            echo "version $pkg is lower than $prev; versions only go up (CONTRIBUTING.md)"
            exit 1
          fi
          if [ "$changed" = true ] && git ls-remote --exit-code --tags origin "refs/tags/v$pkg" >/dev/null; then
            echo "v$pkg is already released; a version is never reused (CONTRIBUTING.md)"
            exit 1
          fi
          release=false
          [ "$changed" = true ] && [ "$GITHUB_EVENT_NAME" = push ] && release=true
          echo "version $prev -> $pkg (changed: $changed, release: $release)"
          {
            echo "release=$release"
            echo "version=$pkg"
            echo "minor=${pkg%.*}"
            echo "major=${pkg%%.*}"
          } >> "$GITHUB_OUTPUT"
      # As in the Dockerfile, no dependency's install script runs, so a compromised package
      # can't do anything at install time. better-sqlite3 loads its bundled prebuild without one.
      - run: npm ci --ignore-scripts
      # Every package came from the npm registry as published (signatures, and provenance
      # where the package has it).
      - run: npm audit signatures
      # No installed package, dev dependencies included (the client's libraries are bundled from
      # them), has a known high or critical advisory. A new advisory can turn this red on a PR
      # that changed nothing: fix it with a bump PR (CONTRIBUTING.md, security updates).
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

  # The image built and booted on every pull request, never pushed. Without it a Dependabot bump
  # of the Node base image or of better-sqlite3 (native, loaded from its musl prebuild) would
  # meet the Dockerfile only after the merge, as a failed `edge` build.
  image-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64 (a Raspberry Pi, an Apple-silicon or ARM home server) is built and booted under QEMU.
      # Only the runtime stage is emulated: the build stage runs on the runner's own platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: clockspan:smoke
          # Reads the layers main's image job caches; a pull request never writes the cache.
          cache-from: type=gha
          provenance: false
      # Health, the SPA shell, /data's owner, root dropped, no npm, npx, corepack or yarn, the
      # HEALTHCHECK command. The image job on main runs the same script before it pushes.
      - name: Boot the amd64 image and check it serves
        run: sh scripts/smoke-image.sh clockspan:smoke
      - name: Build the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: clockspan:smoke-arm64
          cache-from: type=gha
          provenance: false
      # The same checks; better-sqlite3 loading its linuxmusl-arm64 prebuild is the one that
      # only this run can show.
      - name: Boot the arm64 image and check it serves
        run: sh scripts/smoke-image.sh clockspan:smoke-arm64 linux/arm64

  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Every push to main is `edge`; a version bump is also X.Y.Z, X.Y, X and latest. The
          # org.opencontainers.image.version label is the highest-priority tag, and edge (700)
          # outranks raw (200), so without the priority below a release would be labelled edge.
          tags: |
            type=edge,branch=main
            type=raw,value=${{ needs.check.outputs.version }},priority=900,enable=${{ needs.check.outputs.release == 'true' }}
            type=raw,value=${{ needs.check.outputs.minor }},enable=${{ needs.check.outputs.release == 'true' }}
            type=raw,value=${{ needs.check.outputs.major }},enable=${{ needs.check.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.check.outputs.release == 'true' }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both platforms are built and booted before anything is pushed. "Require branches to be up
      # to date" is off, so this commit may not be the one image-smoke booted on the pull request,
      # and a release moves `latest`. The push below rebuilds from the builder's cache and takes
      # seconds.
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: clockspan:smoke
          cache-from: type=gha
          provenance: false
      - name: Boot the amd64 image and check it serves
        run: sh scripts/smoke-image.sh clockspan:smoke
      - name: Build the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: clockspan:smoke-arm64
          cache-from: type=gha
          provenance: false
      - name: Boot the arm64 image and check it serves
        run: sh scripts/smoke-image.sh clockspan:smoke-arm64 linux/arm64
      # One tag set for both platforms: Docker pulls the one that matches the host. The cache is
      # written here, where both runtime stages are in one build.
      - name: Push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations show up as an "unknown/unknown" platform on the GHCR page; skip them.
          provenance: false

  release:
    if: needs.check.outputs.release == 'true'
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Write release body
        run: |
          printf '## Docker\n\n```\ndocker pull %s:%s\n```\n\n' "$IMAGE" "$VERSION" > body.md
      # The tag does not exist yet: gh creates it at --target, the squash commit that bumped the
      # version. A tag made with GITHUB_TOKEN starts no workflow, so nothing runs twice.
      - run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file body.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
