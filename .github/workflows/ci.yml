name: CI

on:
  pull_request:
  push:
    branches: [main] # check + `edge` image; a version bump also publishes the release

# Read-only by default: `check` runs on every PR and needs nothing more. The jobs that
# publish ask for exactly what they write. Every action is pinned to a commit SHA (a tag can be
# moved to other code, a SHA can't); Dependabot bumps the SHA and its version comment together.
permissions:
  contents: read

# A newer push to a pull request replaces the run already going. A push to main gets a group of
# its own (the commit), so no run there is ever cancelled or kept waiting: GitHub keeps only one
# pending run per group and drops the rest, and a dropped run on main could be a release.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # HEAD~1, for the version comparison below
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      # A commit that changes package.json's version is a release: the merge of the bump PR
      # publishes the versioned image and the GitHub Release (no tag is pushed by hand). On a
      # PR the same comparison, against the base branch, refuses a version that already has a
      # tag before anything is built.
      - name: Detect a version bump
        id: version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --depth=1 origin "$base"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          git show "$base:package.json" > /tmp/prev-package.json
          prev="$(node -p "require('/tmp/prev-package.json').version")"
          changed=false
          [ "$pkg" != "$prev" ] && changed=true
          if [ "$changed" = true ] && git ls-remote --exit-code --tags origin "refs/tags/v$pkg" >/dev/null; then
            echo "v$pkg is already released; a version is never reused (CONTRIBUTING.md)"
            exit 1
          fi
          release=false
          [ "$changed" = true ] && [ "$GITHUB_EVENT_NAME" = push ] && release=true
          echo "version $prev -> $pkg (changed: $changed, release: $release)"
          {
            echo "release=$release"
            echo "version=$pkg"
            echo "minor=${pkg%.*}"
          } >> "$GITHUB_OUTPUT"

  # The image built and booted on every pull request, never pushed. Without it a Dependabot bump
  # of the Node base image or of better-sqlite3 (native, loaded from its musl prebuild) would
  # meet the Dockerfile only after the merge, as a failed `edge` build.
  image-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: clockspan:smoke
          # Reads the layers main's image job caches; a pull request never writes the cache.
          cache-from: type=gha
          provenance: false
      - name: Boot the image and check it serves
        run: |
          docker run -d --name smoke -p 8080:8080 clockspan:smoke
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          # The database opened (so the native module loaded) and the server answers.
          curl -fsS http://127.0.0.1:8080/api/health
          # The built client is in the image and the SPA shell is served.
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          # The entrypoint handed /data to PUID 1000 before dropping root.
          test "$(docker exec smoke stat -c %u /data)" = 1000
          # The HEALTHCHECK's own command, run where Docker runs it.
          docker exec smoke sh -c 'wget -qO- "http://127.0.0.1:$PORT/api/health"'
      - name: Container log
        if: always()
        run: docker logs smoke || true

  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Every push to main is `edge`; a version bump is also X.Y.Z, X.Y and latest.
          tags: |
            type=edge,branch=main
            type=raw,value=${{ needs.check.outputs.version }},enable=${{ needs.check.outputs.release == 'true' }}
            type=raw,value=${{ needs.check.outputs.minor }},enable=${{ needs.check.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.check.outputs.release == 'true' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations show up as an "unknown/unknown" platform on the GHCR page; skip them.
          provenance: false

  release:
    if: github.event_name == 'push' && needs.check.outputs.release == 'true'
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Write release body
        run: |
          printf '## Docker\n\n```\ndocker pull %s:%s\n```\n\n' "$IMAGE" "$VERSION" > body.md
      # The tag does not exist yet: gh creates it at --target, the squash commit that bumped the
      # version. A tag made with GITHUB_TOKEN starts no workflow, so nothing runs twice.
      - run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file body.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
