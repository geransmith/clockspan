name: Dependabot auto-merge

# Dependabot's PRs squash-merge on their own once the required checks (check, image-smoke)
# pass. A major version bump waits for a review instead: that is where an upgrade can change
# behaviour the tests don't reach (the components have no automated tests). Version updates
# also wait out a 7-day cooldown in dependabot.yml before they are proposed at all. Nothing
# here checks out or runs the PR's code.
on: pull_request

permissions: {}

# A newer push to the same PR replaces a run still going.
concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    # The PR's author, not github.actor: the actor is whoever caused the latest event, so it
    # can read "dependabot[bot]" on a PR someone else opened.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'geransmith/clockspan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the merge itself, when it falls back to GITHUB_TOKEN
      pull-requests: write # turning on auto-merge, likewise
    env:
      # The app's client ID is not a secret, but a Dependabot run can only read Dependabot
      # secrets, so it is stored as one. Here so the step below can test whether it is set.
      APP_CLIENT_ID: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # GitHub merges on behalf of whoever turned auto-merge on, and starts no workflow for an
      # event GITHUB_TOKEN causes: a merge queued with it lands on main with no CI run there and
      # no new edge image. A token from the repository's own GitHub App does start that run.
      # The app and its two Dependabot secrets are set up once (CONTRIBUTING.md); without them
      # this step is skipped and the merge below falls back to GITHUB_TOKEN.
      - id: app
        if: steps.meta.outputs.update-type != 'version-update:semver-major' && env.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          # Only what the merge needs. Workflows, because an Actions bump edits .github/workflows,
          # which a GitHub App may not merge without it.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # A grouped PR reports its largest change, so one major in a group holds the whole group.
      - name: Queue the squash merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
