name: Build and smoke the image
description: >-
  Builds the image for amd64 and arm64 into the local Docker and boots each with
  scripts/smoke-image.sh. image-smoke (pull requests) and image (main, before it pushes) both run
  it, so a pull request is checked with the steps main publishes after. The repository must be
  checked out first; the buildx builder it sets up stays for the job's later steps.

runs:
  using: composite
  steps:
    # arm64 (a Raspberry Pi, an Apple-silicon or ARM home server) is built and booted under QEMU.
    # Only the runtime stage is emulated: the build stage runs on the runner's own platform.
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: arm64
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        # Docker Hub limits anonymous pulls per IP, and hosted runners share their IPs: a 429
        # from it once failed image-smoke. mirror.gcr.io serves the same digests, and BuildKit
        # falls back to docker.io when the mirror misses.
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
    - name: Build the amd64 image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: clockspan:smoke
        # Reads the layers the image job's push caches; nothing here writes the cache, so a pull
        # request never does.
        cache-from: type=gha
        provenance: false
    # Health, the SPA shell, /data's owner, root dropped, no npm, npx, corepack or yarn, the
    # HEALTHCHECK command.
    - name: Boot the amd64 image and check it serves
      shell: bash
      run: sh scripts/smoke-image.sh clockspan:smoke
    - name: Build the arm64 image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/arm64
        load: true
        tags: clockspan:smoke-arm64
        cache-from: type=gha
        provenance: false
    # The same checks; better-sqlite3 loading its linuxmusl-arm64 prebuild is the one that only
    # this run can show.
    - name: Boot the arm64 image and check it serves
      shell: bash
      run: sh scripts/smoke-image.sh clockspan:smoke-arm64 linux/arm64
