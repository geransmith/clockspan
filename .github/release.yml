changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot, github-actions]
  categories:
    # A `breaking` PR needs a major release (CONTRIBUTING.md) and goes first, where upgraders look.
    - title: Breaking changes
      labels: [breaking]
    - title: New
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Docs
      labels: [documentation]
    - title: Other changes
      labels: ['*']
