changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    # A `breaking` PR needs a major release (CONTRIBUTING.md) and goes first, where upgraders look.
    - title: Breaking changes
      labels: [breaking]
    - title: New
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Docs
      labels: [documentation]
    # Before the catch-all, which would take them: a PR goes in the first category it matches.
    # A patch release cut for a security fix or a base image lists only these.
    - title: Dependency updates
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
