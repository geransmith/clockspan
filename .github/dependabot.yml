# Weekly dependency updates. Every PR is labelled skip-changelog (the release notes exclude
# the dependabot author anyway). workflows/dependabot-automerge.yml squash-merges each one once
# the required checks pass, except a major version bump, which waits for a review.
#
# Every ecosystem waits 7 days after a release before proposing it (GitHub's default is 3).
# With merges unattended, that week is the margin for a hijacked release to be caught and
# pulled first. Security updates never wait.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [skip-changelog]
    # .npmrc pins exact versions; bump the pin rather than widening it to a range.
    versioning-strategy: increase
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node major in `engines`, the Dockerfile and CI, not npm's latest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # ci.yml pins actions to commit SHAs with a `# vX.Y.Z` comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [skip-changelog]
    # One PR for the week's action bumps: the four docker/* actions often release together.
    # Majors are included; a group holding one waits for a review instead of auto-merging.
    groups:
      actions:
        patterns: ['*']

  # The Dockerfile pins node:24-alpine by digest; a PR here moves the digest when the tag does,
  # and CI's image-smoke job builds and boots it before it can merge.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [skip-changelog]
    ignore:
      # A Node major is a deliberate move across `engines`, nvm, CI and the Dockerfile together.
      - dependency-name: node
        update-types: ['version-update:semver-major']
